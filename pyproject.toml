[project]
name = "cascade2phys"
version = "0.0.1"
description = "T1 — Routage deux-physiques sur interface FSI contestée (PoC pré-enregistré)"
requires-python = ">=3.12"
dependencies = [
    "jax[cuda12]==0.10.2",
    "numpy>=2.1.2",
    "scipy>=1.13",
    "equinox>=0.13",   # routeur appris (petit réseau)
    "optax>=0.2",      # Phase 1/2 entraînement
    "xlb==0.3.1",      # oracle fluide (repli AegirJAX) — backend JAX différentiable confirmé
    "warp-lang==1.10.0",  # CONTRAINTE LOAD-BEARING : XLB 0.3.1 importe warp.utils.ScopedTimer,
                          # supprimé en warp-lang>=1.13. Ne PAS dé-épingler sans patcher XLB.
    "scikit-learn>=1.5",  # NearestNeighbors — diagnostic monde-3 (experiments/mixed_substrate.py, T1.5)
    # "jax-fem==0.0.12", # ajouté après smoke test F1
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cascade"]

[tool.ruff]
line-length = 100
target-version = "py312"
